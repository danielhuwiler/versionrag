[project]
name = "versionrag"
version = "0.1.0"
description = "Version-aware RAG system for structured document retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "neo4j>=5.26.0",
    "qdrant-client>=1.12.0",
    "FlagEmbedding>=1.3.0",
    "transformers>=4.40.0,<5.0.0",
    "deepdiff>=8.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pymupdf4llm>=0.0.17",
    "markdown-chunker>=0.0.5",
    "instructor>=1.6.0",
    "openai>=1.50.0",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/versionrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
